name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR to save CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast-fail: run cheap checks first before expensive build/test
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Production Dependency Audit
        run: npm run audit:production

  build-and-test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Check
        run: npm run build:check

      - name: Generate API Docs
        run: npm run docs:api -w packages/core

      - name: Build Website
        run: npm run build --workspace=website

      - name: Validate Documentation Links
        continue-on-error: true
        run: npx --yes markdown-link-check --config .markdown-link-check.json --quiet website/docs/**/*.md README.md CONTRIBUTING.md

      # Run tests with coverage only (no duplicate plain test run)
      - name: Test with Coverage
        run: npm run test:coverage

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/lcov-report/
          retention-days: 14

      - name: Check Outdated Dependencies
        run: npm outdated || true

  container:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INNOVATOR_API_KEYS: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      GH_TOKEN: test-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build Production Image
        run: docker build -t innovator:ci .
