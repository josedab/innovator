name: "Innovator — AI Innovation Engine"
description: "Run AI-powered innovation analysis on issues and subjects. Generates investigations, ideas from 8 creativity angles, and strategic synthesis."
author: "Innovator"

branding:
  icon: "zap"
  color: "yellow"

inputs:
  subject:
    description: "Subject to investigate. If empty, reads from issue body when triggered by issues.labeled."
    required: false
    default: ""
  angles:
    description: "Comma-separated angle IDs to use (default: all 8 angles)"
    required: false
    default: ""
  depth:
    description: "Investigation depth: shallow, standard, or deep"
    required: false
    default: "standard"
  label:
    description: "Issue label that triggers innovation (for issues.labeled trigger)"
    required: false
    default: "needs-innovation"
  model:
    description: "LLM model to use"
    required: false
    default: ""
  post-comment:
    description: "Post results as issue comment (true/false)"
    required: false
    default: "true"
  config-path:
    description: "Path to .innovator/config.yaml for project-specific defaults"
    required: false
    default: ".innovator/config.yaml"
  save-session:
    description: "Save pipeline results to .innovator/sessions/ (true/false)"
    required: false
    default: "false"
  novelty-check:
    description: "Score ideas for novelty against prior art (true/false)"
    required: false
    default: "false"

outputs:
  markdown:
    description: "Full results as formatted Markdown"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install Innovator CLI
      shell: bash
      run: |
        npm install -g @innovator/cli@latest 2>/dev/null || echo "Using local CLI"

    - name: Determine subject
      id: subject
      shell: bash
      env:
        INPUT_SUBJECT: ${{ inputs.subject }}
        EVENT_NAME: ${{ github.event_name }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
      run: |
        SUBJECT="$INPUT_SUBJECT"
        if [ -z "$SUBJECT" ] && [ "$EVENT_NAME" = "issues" ]; then
          SUBJECT="$ISSUE_TITLE"
        fi
        if [ -z "$SUBJECT" ]; then
          echo "::error::No subject provided and not triggered by an issue"
          exit 1
        fi
        echo "value=$SUBJECT" >> $GITHUB_OUTPUT

    - name: Read IaC config
      id: config
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        if [ -f "$CONFIG_PATH" ]; then
          echo "found=true" >> $GITHUB_OUTPUT
          # Extract defaultModel from YAML (simple grep, no yq dependency)
          MODEL=$(grep 'defaultModel:' "$CONFIG_PATH" 2>/dev/null | head -1 | sed 's/.*defaultModel:\s*//' | tr -d '"' | tr -d "'")
          if [ -n "$MODEL" ]; then
            echo "model=$MODEL" >> $GITHUB_OUTPUT
          fi
          # Extract defaultAngles
          ANGLES=$(grep -A20 'defaultAngles:' "$CONFIG_PATH" 2>/dev/null | grep '^\s*-' | sed 's/.*-\s*//' | tr '\n' ',' | sed 's/,$//')
          if [ -n "$ANGLES" ]; then
            echo "angles=$ANGLES" >> $GITHUB_OUTPUT
          fi
        else
          echo "found=false" >> $GITHUB_OUTPUT
        fi

    - name: Run innovation pipeline
      id: innovate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INNOVATOR_SUBJECT: ${{ steps.subject.outputs.value }}
        INNOVATOR_DEPTH: ${{ inputs.depth }}
        INNOVATOR_ANGLES: ${{ inputs.angles }}
        INNOVATOR_CONFIG_ANGLES: ${{ steps.config.outputs.angles }}
        INNOVATOR_MODEL: ${{ inputs.model }}
        INNOVATOR_CONFIG_MODEL: ${{ steps.config.outputs.model }}
        INNOVATOR_SAVE: ${{ inputs.save-session }}
        INNOVATOR_NOVELTY: ${{ inputs.novelty-check }}
      run: |
        ARGS=(auto "$INNOVATOR_SUBJECT" --depth "$INNOVATOR_DEPTH")

        # Use IaC config defaults, overridden by explicit inputs
        if [ -n "$INNOVATOR_ANGLES" ]; then
          ARGS+=(--angles "$INNOVATOR_ANGLES")
        elif [ -n "$INNOVATOR_CONFIG_ANGLES" ]; then
          ARGS+=(--angles "$INNOVATOR_CONFIG_ANGLES")
        fi

        if [ -n "$INNOVATOR_MODEL" ]; then
          ARGS+=(--model "$INNOVATOR_MODEL")
        elif [ -n "$INNOVATOR_CONFIG_MODEL" ]; then
          ARGS+=(--model "$INNOVATOR_CONFIG_MODEL")
        fi

        if [ "$INNOVATOR_SAVE" = "true" ]; then
          ARGS+=(--save)
        fi

        if [ "$INNOVATOR_NOVELTY" = "true" ]; then
          ARGS+=(--novelty)
        fi

        # Run and capture output
        npx innovator "${ARGS[@]}" 2>&1 | tee /tmp/innovator-output.txt || true

        # Set output
        echo "markdown<<EOF" >> $GITHUB_OUTPUT
        cat /tmp/innovator-output.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Post comment on issue
      if: inputs.post-comment == 'true' && github.event_name == 'issues'
      uses: actions/github-script@v7
      env:
        INNOVATOR_OUTPUT: ${{ steps.innovate.outputs.markdown }}
      with:
        script: |
          const output = `## 💡 Innovation Analysis

          ${process.env.INNOVATOR_OUTPUT}

          ---
          *Generated by [Innovator](https://github.com/josedab/innovator) — AI-Powered Innovation Engine*
          `;
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: output.replace(/          /g, ''),
          });
