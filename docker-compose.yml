services:
  innovator:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - INNOVATOR_API_KEY=${INNOVATOR_API_KEY}
      - INNOVATOR_DEFAULT_MODEL=${INNOVATOR_DEFAULT_MODEL:-gpt-4.1}
      - INNOVATOR_LLM_TIMEOUT_MS=${INNOVATOR_LLM_TIMEOUT_MS:-90000}
      - GH_TOKEN=${GH_TOKEN}
    restart: unless-stopped
