<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="40" fill="#0f0f23" rx="12"/>
  <rect x="0" y="20" width="800" height="20" fill="#0f0f23"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="20" r="6" fill="#febc2e"/>
  <circle cx="60" cy="20" r="6" fill="#28c840"/>
  <text x="400" y="25" text-anchor="middle" fill="#8888aa" font-family="system-ui" font-size="13">Innovator — AI-Powered Innovation Engine</text>

  <!-- Subject input area -->
  <rect x="40" y="60" width="720" height="50" fill="#1e2d4a" rx="8" stroke="#334466" stroke-width="1"/>
  <text x="60" y="90" fill="#667799" font-family="system-ui" font-size="14">💡 Enter a subject to investigate...</text>
  <rect x="660" y="70" width="80" height="30" fill="#3b82f6" rx="6"/>
  <text x="700" y="90" text-anchor="middle" fill="white" font-family="system-ui" font-size="12" font-weight="bold">Explore</text>

  <!-- Angle cards -->
  <text x="40" y="140" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="bold">Innovation Angles</text>

  <rect x="40" y="155" width="170" height="80" fill="#1e2d4a" rx="8" stroke="#334466" stroke-width="1"/>
  <text x="55" y="180" fill="#60a5fa" font-family="system-ui" font-size="13" font-weight="bold">🔄 SCAMPER</text>
  <text x="55" y="200" fill="#8899bb" font-family="system-ui" font-size="11">Substitute, Combine,</text>
  <text x="55" y="215" fill="#8899bb" font-family="system-ui" font-size="11">Adapt, Modify...</text>

  <rect x="220" y="155" width="170" height="80" fill="#1e2d4a" rx="8" stroke="#334466" stroke-width="1"/>
  <text x="235" y="180" fill="#60a5fa" font-family="system-ui" font-size="13" font-weight="bold">🧱 First Principles</text>
  <text x="235" y="200" fill="#8899bb" font-family="system-ui" font-size="11">Decompose to truths,</text>
  <text x="235" y="215" fill="#8899bb" font-family="system-ui" font-size="11">rebuild solutions</text>

  <rect x="400" y="155" width="170" height="80" fill="#1e2d4a" rx="8" stroke="#334466" stroke-width="1"/>
  <text x="415" y="180" fill="#60a5fa" font-family="system-ui" font-size="13" font-weight="bold">🌐 Cross-Domain</text>
  <text x="415" y="200" fill="#8899bb" font-family="system-ui" font-size="11">Map concepts from</text>
  <text x="415" y="215" fill="#8899bb" font-family="system-ui" font-size="11">unrelated fields</text>

  <rect x="580" y="155" width="170" height="80" fill="#1e2d4a" rx="8" stroke="#334466" stroke-width="1"/>
  <text x="595" y="180" fill="#60a5fa" font-family="system-ui" font-size="13" font-weight="bold">🔒 Constraints</text>
  <text x="595" y="200" fill="#8899bb" font-family="system-ui" font-size="11">Add constraints to</text>
  <text x="595" y="215" fill="#8899bb" font-family="system-ui" font-size="11">force breakthroughs</text>

  <!-- Results area -->
  <text x="40" y="270" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="bold">Generated Ideas</text>

  <rect x="40" y="285" width="350" height="140" fill="#1e2d4a" rx="8" stroke="#334466" stroke-width="1"/>
  <rect x="55" y="300" width="60" height="20" fill="#22c55e33" rx="4"/>
  <text x="85" y="314" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="10">High Impact</text>
  <text x="55" y="345" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="bold">AI-Driven Code Review</text>
  <text x="55" y="365" fill="#8899bb" font-family="system-ui" font-size="11">Automated review using pattern</text>
  <text x="55" y="380" fill="#8899bb" font-family="system-ui" font-size="11">recognition and best practices...</text>
  <text x="55" y="405" fill="#667799" font-family="system-ui" font-size="10">⭐ 94/100 feasibility</text>

  <rect x="410" y="285" width="350" height="140" fill="#1e2d4a" rx="8" stroke="#334466" stroke-width="1"/>
  <rect x="425" y="300" width="60" height="20" fill="#3b82f633" rx="4"/>
  <text x="455" y="314" text-anchor="middle" fill="#3b82f6" font-family="system-ui" font-size="10">Novel</text>
  <text x="425" y="345" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="bold">Collaborative Insights</text>
  <text x="425" y="365" fill="#8899bb" font-family="system-ui" font-size="11">Cross-team knowledge sharing</text>
  <text x="425" y="380" fill="#8899bb" font-family="system-ui" font-size="11">through structured debates...</text>
  <text x="425" y="405" fill="#667799" font-family="system-ui" font-size="10">⭐ 87/100 feasibility</text>
