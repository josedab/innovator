name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "website/**"
      - "examples/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/CODE_OF_CONDUCT.md"
      - ".github/SUPPORT.md"
      - ".github/SECURITY.md"
      - ".github/pull_request_template.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "website/**"
      - "examples/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/CODE_OF_CONDUCT.md"
      - ".github/SUPPORT.md"
      - ".github/SECURITY.md"
      - ".github/pull_request_template.md"
      - "LICENSE"

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR to save CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast-fail: run cheap checks first before expensive build/test
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

  build-and-test:
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Check
        run: npm run build:check

      - name: Generate API Docs
        run: npm run docs:api -w packages/core

      - name: Build Website
        run: npm run build --workspace=website

      - name: Validate Documentation Links
        continue-on-error: true
        run: npx --yes markdown-link-check --config .markdown-link-check.json --quiet website/docs/**/*.md README.md CONTRIBUTING.md

      # Run tests with coverage only (no duplicate plain test run)
      - name: Test with Coverage
        run: npm run test:coverage

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/lcov-report/

      - name: Check Outdated Dependencies
        run: npm outdated || true

      - name: Security Audit
        run: npm audit --audit-level=high --omit=dev || echo "::warning::npm audit found vulnerabilities — review before release"
