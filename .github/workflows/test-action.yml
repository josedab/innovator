name: "Test Action"

on:
  pull_request:
    paths:
      - "action/**"
      - "apps/cli/**"
      - "packages/core/**"
  push:
    branches: [main]
    paths:
      - "action/**"
      - "apps/cli/**"
      - "packages/core/**"

permissions:
  contents: read

concurrency:
  group: test-action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-action:
    name: Validate GitHub Action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Validate action.yml syntax
        run: |
          # Ensure action.yml is valid YAML and has required fields (pure Node, no deps)
          node -e "
            const fs = require('fs');
            // Parse YAML without js-yaml by using a simple JSON-via-action check
            // action.yml is simple enough for line-based validation
            const content = fs.readFileSync('action/action.yml', 'utf8');
            const requiredKeys = ['name:', 'description:', 'inputs:', 'outputs:', 'runs:'];
            const missing = requiredKeys.filter(k => !content.includes(k));
            if (missing.length) {
              console.error('Missing required fields:', missing.map(k => k.replace(':', '')).join(', '));
              process.exit(1);
            }

            // Validate runs.using is 'composite'
            if (!content.includes('using: composite') && !content.includes(\"using: 'composite'\") && !content.includes('using: \\\"composite\\\"')) {
              console.error('Expected composite action');
              process.exit(1);
            }

            console.log('✅ action.yml validation passed');
          "

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify CLI package builds
        run: |
          npm run build --workspace=packages/core
          npm run build --workspace=apps/cli

      - name: Verify CLI commands referenced in action exist
        run: |
          # The action uses 'npx innovator auto' — verify the CLI has an 'auto' command
          npx tsx apps/cli/src/index.ts --help | grep -q "auto" || \
            (echo "❌ CLI missing 'auto' command referenced by action" && exit 1)
          echo "✅ CLI 'auto' command exists"
