# Example: Weekly innovation digest via cron
# Generates innovation ideas for project board items every Monday

name: Weekly Innovation Digest
on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am UTC
  workflow_dispatch:
    inputs:
      subject:
        description: "Override subject (default: reads from project)"
        required: false
        type: string

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: josedab/innovator/action@main
        with:
          subject: ${{ github.event.inputs.subject || 'Weekly product innovation review' }}
          depth: "deep"
          post-comment: "false"
