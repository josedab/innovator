services:
  innovator:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      INNOVATOR_DEPLOYMENT_PROFILE: single-tenant
      INNOVATOR_API_KEYS: ${INNOVATOR_API_KEYS:?Set a 32+ character INNOVATOR_API_KEYS value}
      INNOVATOR_DEFAULT_MODEL: ${INNOVATOR_DEFAULT_MODEL:-gpt-4.1}
      INNOVATOR_LLM_TIMEOUT_MS: ${INNOVATOR_LLM_TIMEOUT_MS:-90000}
      GH_TOKEN: ${GH_TOKEN:?Set GH_TOKEN for the Copilot provider}
    volumes:
      - innovator_data:/home/innovator/.innovator
      - copilot_data:/home/innovator/.copilot
    restart: unless-stopped
    stop_grace_period: 2m
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http = require('http'); http.get('http://localhost:3000/readyz', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 12s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  innovator_data:
  copilot_data:
