name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff0a06df1d24beb54e1cfbe9af82502eaa0e539f # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff0a06df1d24beb54e1cfbe9af82502eaa0e539f # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff0a06df1d24beb54e1cfbe9af82502eaa0e539f # v3
        with:
          category: "/language:${{ matrix.language }}"
